server.port=8080
spring.application.name=api-gateway

# Service routes via Eureka load balancer
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/gateway/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/gateway/auth/?(?<segment>.*), /api/auth/$\{segment}

spring.cloud.gateway.server.webflux.routes[1].id=delivery-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://delivery-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/gateway/deliveries/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/gateway/deliveries/?(?<segment>.*), /api/deliveries/$\{segment}

spring.cloud.gateway.server.webflux.routes[2].id=tracking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://tracking-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/gateway/tracking/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/gateway/tracking/?(?<segment>.*), /api/tracking/$\{segment}

spring.cloud.gateway.server.webflux.routes[3].id=admin-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://admin-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/gateway/admin/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/gateway/admin/?(?<segment>.*), /api/admin/$\{segment}

# Swagger api-docs routes via Eureka
spring.cloud.gateway.server.webflux.routes[4].id=auth-service-docs
spring.cloud.gateway.server.webflux.routes[4].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=delivery-service-docs
spring.cloud.gateway.server.webflux.routes[5].uri=lb://delivery-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/v3/api-docs/delivery-service
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[6].id=tracking-service-docs
spring.cloud.gateway.server.webflux.routes[6].uri=lb://tracking-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/v3/api-docs/tracking-service
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[7].id=admin-service-docs
spring.cloud.gateway.server.webflux.routes[7].uri=lb://admin-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/v3/api-docs/admin-service
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs
# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Swagger aggregation
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth-service
springdoc.swagger-ui.urls[1].name=Delivery Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/delivery-service
springdoc.swagger-ui.urls[2].name=Tracking Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/tracking-service
springdoc.swagger-ui.urls[3].name=Admin Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/admin-service
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
app.jwt.secret=SmartCourierSecretKey2024SmartCourierSecretKey2024
app.jwt.expiration=86400000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=gateway,health,info


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true