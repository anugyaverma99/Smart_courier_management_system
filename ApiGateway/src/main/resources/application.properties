server.port=8080

spring.application.name=api-gateway



spring.cloud.gateway.server.webflux.routes[0].id=auth-service

spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/gateway/auth/**

spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1



spring.cloud.gateway.server.webflux.routes[1].id=delivery-service

spring.cloud.gateway.server.webflux.routes[1].uri=lb://delivery-service

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/gateway/deliveries/**

spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1



spring.cloud.gateway.server.webflux.routes[2].id=tracking-service

spring.cloud.gateway.server.webflux.routes[2].uri=lb://tracking-service

spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/gateway/tracking/**

spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1



spring.cloud.gateway.server.webflux.routes[3].id=admin-service

spring.cloud.gateway.server.webflux.routes[3].uri=lb://admin-service

spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/gateway/admin/**

spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1



spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true



app.jwt.secret=SmartCourierSecretKey2024SmartCourierSecretKey2024

app.jwt.expiration=86400000


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=gateway,health,info